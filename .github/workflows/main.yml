name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          msbuild HWorkshopExtender.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\HWorkshopExtender\Release\*" `
            -DestinationPath "${{ github.workspace }}\HWorkshopExtender.zip" `
            -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            HWorkshopExtender.zip
